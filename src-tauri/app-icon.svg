<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1848"/>
      <stop offset="1" stop-color="#0d0a16"/>
    </linearGradient>
    <linearGradient id="moon" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#f4ebff"/>
      <stop offset="0.55" stop-color="#d4b6ff"/>
      <stop offset="1" stop-color="#a86dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a86dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a86dff" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="500" cy="530" r="300" fill="#fff"/>
      <circle cx="640" cy="420" r="250" fill="#000"/>
    </mask>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <circle cx="500" cy="530" r="400" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
  <circle cx="712" cy="300" r="22" fill="#f4ebff"/>
  <circle cx="790" cy="420" r="12" fill="#d4b6ff"/>
  <circle cx="660" cy="200" r="9" fill="#d4b6ff" opacity="0.8"/>
</svg>
