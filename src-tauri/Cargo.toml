[package]
name = "luna"
version = "0.7.0"
description = "Luna: per-screen display tuning, crosshair overlay and gaming tweaks for Windows, macOS and Linux"
authors = ["Luna contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "luna_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_System_Memory",
  "Win32_UI_ColorSystem",
  "Win32_UI_Magnification",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Time",
  "Win32_System_Performance",
  "Win32_System_RemoteDesktop",
] }

[target."cfg(not(windows))".dependencies]
device_query = "4.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
